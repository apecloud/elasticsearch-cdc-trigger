plugins {
    id 'cc-es-trigger.java-conventions'
}

java.sourceCompatibility = JavaVersion.VERSION_1_8

dependencies {
    implementation project(':es-trigger-base')
    implementation("org.elasticsearch.client:elasticsearch-rest-high-level-client:${ES6_VERSION}") {
        exclude group: 'org.elasticsearch', module: 'elasticsearch'
    }

    compileOnly("org.elasticsearch:elasticsearch:${ES6_VERSION}")
    testImplementation("org.elasticsearch.client:elasticsearch-rest-high-level-client:${ES6_VERSION}")
}

tasks.register("prepare") {
    dependsOn build

    copy {
        from("src/main/resources")
        into "${buildDir}/es-sink-es6"
    }

    copy {
        from("${buildDir}/libs/es-sink-es6-0.0.1-SNAPSHOT.jar")
        into "${buildDir}/es-sink-es6"
    }

    copy {
        from configurations.runtimeClasspath
        into "${buildDir}/es-sink-es6"
    }
}

tasks.register("dist", Zip) {
    dependsOn prepare

    from "${buildDir}/es-sink-es6"

    archiveFileName = "es-sink-es6.zip"
    destinationDirectory = file("${buildDir}/dist")
}

description = 'es-sink-es6'
